name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the uploaded zip
        run: |
          z=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$z" ]; then
            unzip -q -o "$z" -d /tmp/proj
            cp -r /tmp/proj/*/. .
          fi
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ServerSlides.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ServerSlides-APK
          path: ServerSlides.apk
